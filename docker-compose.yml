services:
  redis:
    image: redis:7-alpine
    container_name: bookit-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: bookit-mysql
    profiles: ["full"]
    environment:
      MYSQL_DATABASE: bookit
      MYSQL_USER: bookit
      MYSQL_PASSWORD: bookitpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  bookit-app:
    build: .
    container_name: bookit-app
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bookit
      DB_USERNAME: bookit
      DB_PASSWORD: bookitpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: Ym9va2l0LWRldmVsb3BtZW50LXNlY3JldC1rZXktMzItYnl0ZXM=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  redis-data:
  mysql-data:
