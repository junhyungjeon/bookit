name: Bookit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v4

      - name: Java 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Wrapper 실행 권한 부여
        run: chmod +x mvnw

      - name: 테스트 실행
        run: ./mvnw test
