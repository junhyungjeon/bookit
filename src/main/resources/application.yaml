spring:
  application:
    name: bookit

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookit}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

reservation:
  redis-lock:
    wait-ms: 300
    lease-ms: 5000
  reminder:
    fixed-delay-ms: 60000

jwt:
  secret: ${JWT_SECRET:Ym9va2l0LWRldmVsb3BtZW50LXNlY3JldC1rZXktMzItYnl0ZXM=}
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
